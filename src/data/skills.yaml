version: "1.0"
name: habilidades_1
game: Dungeon Deck - A Fornalha Sombria
placeholder:
  symbol: "*"
  jsonToken: "{value}"
  description: Use o valor específico da carta para substituir {value} no texto e no label.
categories:
  - habilidade
  - poder_heroi
  - efeito_roxo_monstro
  - habilidade_item
  - habilidade_dungeon
  - habilidade_chefe
abilities:
  - id: skill_crimson_fury
    category: habilidade
    target: self
    operate_type: op_triggered
    trigger:
      event: evt_attack_declared
    nature:
      - nat_physical
      - nat_fire
    effect:
      - kind: i_damage
        to: $source
        amount: $value
        minimum: 1
      - kind: p_modifier
        to: $source
        stat: s_damage_dealt
        operation: add
        value:
          op: mul
          args:
            - $value
            - 3
        duration:
          kind: once
  - id: skill_last_light_healing
    category: habilidade
    target: hero_or_ally_creature
    effect:
      - kind: i_heal
        to: $target
        amount: $value
    operate_type: op_active
    nature:
      - nat_magical
      - nat_holy
  - id: skill_bastion_guard
    category: habilidade
    target: hero_or_ally
    effect:
      - kind: p_modifier
        to: $source
        stat: s_damage_reduction
        operation: add
        value: $value
        duration:
          kind: once
    operate_type: op_triggered
    trigger:
      event: evt_damage_taken
    nature:
      - nat_physical
  - id: skill_rift_rune
    category: habilidade
    target: ally_die
    operate_type: op_triggered
    trigger:
      event: evt_roll
    nature:
      - nat_magical
    effect:
      - kind: i_modify_die
        delta: $value
        die_side: hero
  - id: skill_hunter_focus
    category: habilidade
    target: self
    script: skill_hunter_focus
    operate_type: op_passive
    nature:
      - nat_physical
  - id: skill_living_ember
    category: habilidade
    target: creature_in_play
    effect:
      - kind: i_damage
        to: $target
        amount: $value
    operate_type: op_active
    nature:
      - nat_physical
      - nat_fire
  - id: skill_living_ember_oil
    category: habilidade_item
    target: creature_in_play
    operate_type: op_active
    nature:
      - nat_physical
      - nat_fire
    effect:
      - kind: i_if
        when:
          kind: has_skill
          of: $target
          skillId: skill_gelatinous_body
        then:
          - kind: i_damage
            to: $target
            amount: 3
        else:
          - kind: i_damage
            to: $target
            amount: 2
  - id: skill_last_light_shield
    category: habilidade
    target: hero
    effect:
      - kind: i_prevent_next_damage
        to: $target
    operate_type: op_triggered
    trigger:
      event: evt_damage_taken
    cooldown:
      scope: round
      charges: 1
    nature:
      - nat_magical
      - nat_holy
  - id: skill_preserved_path
    category: habilidade
    target: dungeon
