version: "1.0"
name: habilidades_1
game: Dungeon Deck - A Fornalha Sombria
placeholder:
  symbol: "*"
  jsonToken: "{value}"
  description: Use o valor específico da carta para substituir {value} no texto e no label.
categories:
  - habilidade
  - poder_heroi
  - efeito_roxo_monstro
  - habilidade_item
  - habilidade_dungeon
  - habilidade_chefe
abilities:
  - id: skill_crimson_fury
    category: habilidade
    trigger: before_attack
    target: self
    script: skill_crimson_fury
  - id: skill_last_light_healing
    category: habilidade
    trigger: on_use
    target: hero_or_ally_creature
    effect:
      - kind: apply_heal
        to: $target
        amount: $value
  - id: skill_bastion_guard
    category: habilidade
    trigger: on_damage_taken
    target: hero_or_ally
    effect:
      - kind: add_modifier
        to: $source
        stat: damage_reduction
        operation: add
        value: $value
        duration:
          kind: once
  - id: skill_rift_rune
    category: habilidade
    trigger: after_roll
    target: ally_die
    script: skill_rift_rune
  - id: skill_hunter_focus
    category: habilidade
    trigger: while_equipped
    target: self
    script: skill_hunter_focus
  - id: skill_living_ember
    category: habilidade
    trigger: on_use
    target: creature_in_play
    effect:
      - kind: apply_damage
        to: $target
        amount: $value
  - id: skill_living_ember_oil
    category: habilidade_item
    trigger: on_use
    target: creature_in_play
    notes: Migrada para script (patch-10). Condicional baseada em skill_gelatinous_body do alvo.
    script: skill_living_ember_oil
  - id: skill_last_light_shield
    category: habilidade
    trigger: once_per_round_on_damage_taken
    target: hero
    effect:
      - kind: prevent_next_damage
        to: $target
  - id: skill_preserved_path
    category: habilidade
    trigger: once_per_room_on_dungeon_discard
    target: dungeon
    effect:
      - kind: prevent_dungeon_discard
  - id: skill_rekindled_forge
    category: habilidade
    trigger: on_win_room
    target: group
    script: skill_rekindled_forge
  - id: skill_rift_second_chance
    category: habilidade
    trigger: once_per_combat
    target: ally_die
    script: skill_rift_second_chance
  - id: skill_perfect_rune
    category: habilidade
    trigger: once_per_room_after_roll
    target: ally_die
    script: skill_perfect_rune
  - id: skill_last_light_miracle
    category: habilidade
    trigger: once_per_room
    target: ally_or_next_attack
    effect:
      - kind: choose_one
        options:
          - label: Curar 2
            effect:
              - kind: apply_heal
                to: $target
                amount: 2
          - label: +2 dano
            effect:
              - kind: add_modifier
                to: $source
                stat: damage_bonus
                operation: add
                value: 2
                duration:
                  kind: once
  - id: skill_piercing_strike
    category: habilidade
    trigger: on_destroy_creature_with_attack
    target: other_creature_in_same_room
    script: skill_piercing_strike
  - id: skill_forge_spoils
    category: habilidade
    trigger: on_win_room
    target: item_deck
    effect:
      - kind: draw_and_choose
        pile: item_deck
        reveal: 2
        keep: 1
  - id: skill_prey_mark
    category: habilidade
    trigger: start_of_combat
    target: creature_in_room
    effect:
      - kind: mark_target
        to: $target
      - kind: add_modifier
        to: $source
        stat: tohit_bonus
        operation: add
        value: $value
        duration:
          kind: until_end_of_combat
  - id: skill_return_rite
    category: habilidade
    trigger: once_per_room
    target: dungeon
    effect:
      - kind: apply_damage
        to: $source
        amount: 3
      - kind: recover_dungeon
        count: $value
  - id: skill_final_dawn_light
    category: habilidade
    trigger: combat_if_dungeon_red_or_purple
    target: self
    effect:
      - kind: add_modifier
        to: $source
        stat: tohit_bonus
        operation: add
        value: 2
        duration:
          kind: until_end_of_combat
      - kind: add_modifier
        to: $source
        stat: damage_bonus
        operation: add
        value: 2
        duration:
          kind: until_end_of_combat
    params:
      tohit: 2
      damage: 2
  - id: skill_scorching_heat
    category: habilidade
    trigger: first_roll_in_room
    target: heroes
    effect:
      - kind: for_each
        over: all_heroes
        as: $h
        do:
          - kind: add_modifier
            to: $target
            stat: tohit_penalty
            operation: add
            value: $value
            duration:
              kind: once
  - id: skill_crimson_chains
    category: habilidade
    trigger: until_end_of_round
    target: hero
    effect:
      - kind: block_action
        what: flee
  - id: skill_choking_ashes
    category: habilidade
    trigger: on_use
    target: lowest_life_hero
    effect:
      - kind: apply_damage
        to: $lowest_life_hero
        amount: $value
  - id: skill_charred_plate
    category: habilidade
    trigger: on_take_attack_damage
    target: self
    effect:
      - kind: add_modifier
        to: $source
        stat: damage_reduction
        operation: add
        value: $value
        duration:
          kind: while_in_play
  - id: skill_forge_awakening
    category: habilidade
    trigger: on_use
    target: dungeon
    effect:
      - kind: advance_dungeon_level
        amount: $value
  - id: skill_sealed_door
    category: habilidade
    trigger: while_room_active_first_combat
    target: heroes
    effect:
      - kind: block_action
        what: flee
  - id: skill_ruined_floor
    category: habilidade
    trigger: first_hero_lose_combat_in_room
    target: dungeon
    effect:
      - kind: discard_from
        pile: dungeon
        count: 1
  - id: skill_forge_smoke
    category: habilidade
    trigger: first_round_in_room
    target: heroes
    effect:
      - kind: block_action
        what: heal
  - id: skill_dark_tribute
    category: habilidade
    trigger: before_first_combat_in_room
    target: group
    effect:
      - kind: choose_one
        options:
          - label: Descartar 1 item
            effect:
              - kind: discard_from
                pile: item
                count: 1
          - label: Descartar 1 carta de dungeon
            effect:
              - kind: discard_from
                pile: dungeon
                count: 1
  - id: skill_rift_evasion
    category: habilidade
    trigger: first_item_effect_received
    target: self
    script: skill_rift_evasion
  - id: skill_chains_prison
    category: habilidade
    trigger: on_first_target_chosen_in_room
    target: target_hero
    effect:
      - kind: add_modifier
        to: $target
        stat: tohit_penalty
        operation: add
        value: 2
        duration:
          kind: once
  - id: skill_path_corruption
    category: habilidade
    trigger: while_room_active
    target: heroes
    effect:
      - kind: block_action
        what: dungeon_discard
  - id: skill_lone_beast
    category: habilidade
    trigger: combat_if_alone_in_room
    target: self
    effect:
      - kind: add_modifier
        to: $source
        stat: tohit_bonus
        operation: add
        value: $value
        duration:
          kind: until_end_of_combat
      - kind: add_modifier
        to: $source
        stat: damage_bonus
        operation: add
        value: $value
        duration:
          kind: until_end_of_combat
  - id: skill_treacherous_attack
    category: habilidade
    trigger: on_enter_combat
    target: lowest_life_hero
    notes: No texto original, o nome possui variável, mas o efeito-base cita 1 dano. Use {value} quando quiser escalar.
    effect:
      - kind: apply_damage
        to: $lowest_life_hero
        amount: $value
  - id: skill_cowardly_flee
    category: habilidade
    trigger: on_flee_or_leave_play
    target: self
    effect:
      - kind: set_no_reward
        to: $source
  - id: skill_gelatinous_body
    category: habilidade
    trigger: while_active
    target: heroes_attacking_self
    effect:
      - kind: add_modifier
        to: $source
        stat: tohit_penalty
        operation: add
        value: $value
        duration:
          kind: while_in_play
  - id: skill_hidden_flame_presence
    category: habilidade
    trigger: combat_if_another_creature_in_room
    target: another_creature_in_room
    effect:
      - kind: add_modifier
        to: $source
        stat: tohit_bonus
        operation: add
        value: $value
        duration:
          kind: until_end_of_combat
  - id: skill_pack_courage
    category: habilidade
    trigger: combat_if_another_creature_in_room
    target: self
    effect:
      - kind: add_modifier
        to: $source
        stat: tohit_bonus
        operation: add
        value: $value
        duration:
          kind: until_end_of_combat
  - id: skill_illuminate_path
    category: habilidade
    trigger: on_reveal_paths
    target: dungeon
    effect:
      - kind: reveal_dungeon
        count: $value
  - id: skill_path_safeguard
    category: habilidade
    trigger: on_dungeon_discard
    target: dungeon
    effect:
      - kind: prevent_dungeon_discard
  - id: skill_life_drain
    category: habilidade
    trigger: on_deal_damage
    target: self
    effect:
      - kind: apply_heal
        to: $source
        amount: $value
  - id: skill_opportunity_shot
    category: habilidade
    trigger: once_per_combat_instead_of_attack
    target: creature
    script: skill_opportunity_shot
  - id: skill_last_light_ward
    category: habilidade
    trigger: on_purple_effect_damage_taken
    target: self
    effect:
      - kind: add_modifier
        to: $source
        stat: purple_damage_reduction
        operation: add
        value: $value
        duration:
          kind: while_in_play
  - id: skill_protective_veil
    category: habilidade
    trigger: once_per_room_on_targeted_by_effect
    target: self
    effect:
      - kind: ignore_next_targeting
        to: $source
  - id: skill_rift_light_step
    category: habilidade
    trigger: once_per_room_on_extra_dungeon_discard
    target: self
    effect:
      - kind: prevent_dungeon_discard
  - id: skill_focus_deflection
    category: habilidade
    trigger: once_per_room_on_targeted
    target: another_hero_or_self
    script: skill_focus_deflection
  - id: skill_minor_rune
    category: habilidade
    trigger: once_per_room_after_roll
    target: die_with_value_1
    script: skill_minor_rune
  - id: power_greater_last_light_miracle
    category: poder_heroi
    trigger: once_per_game
    target: hero
    effect:
      - kind: choose_one
        options:
          - label: Curar totalmente
            effect:
              - kind: apply_full_heal
                to: $target
          - label: Sobreviver com 1 vida
            effect:
              - kind: prevent_destroy
                to: $target
  - id: power_unbreakable_bastion_guard
    category: poder_heroi
    trigger: once_per_game_until_end_of_round
    target: heroes
    effect:
      - kind: for_each
        over: all_heroes
        as: $loopHero
        do:
          - kind: add_modifier
            to: $target
            stat: damage_reduction
            operation: add
            value: 1
            duration:
              kind: until_end_of_round
  - id: power_restored_path
    category: poder_heroi
    trigger: once_per_game
    target: dungeon
    effect:
      - kind: recover_dungeon
        count: $value
  - id: power_supreme_rift_rune
    category: poder_heroi
    trigger: once_per_game_after_any_roll
    target: ally_or_enemy_die
    script: power_supreme_rift_rune
  - id: power_mighty_crimson_fury
    category: poder_heroi
    trigger: once_per_game_on_use_furia_rubra
    target: self
    params:
      bonus: 6
    effect:
      - kind: add_modifier
        to: $source
        stat: damage_bonus
        operation: add
        value: $bonus
        duration:
          kind: until_end_of_combat
  - id: power_last_light_oath
    category: poder_heroi
    trigger: once_per_game
    target: heroes_or_self_next_attack
    effect:
      - kind: choose_one
        options:
          - label: Curar todos (5)
            effect:
              - kind: for_each
                over: all_heroes
                as: $h
                do:
                  - kind: apply_heal
                    to: $target
                    amount: 5
          - label: +5 dano sagrado
            effect:
              - kind: add_modifier
                to: $source
                stat: damage_bonus
                operation: add
                value: 5
                duration:
                  kind: once
  - id: power_deep_veil_echo
    category: poder_heroi
    trigger: once_per_game_on_defeat_creature
    target: self
    script: power_deep_veil_echo
  - id: power_hunter_execution
    category: poder_heroi
    trigger: once_per_game_after_roll_vs_prey
    target: blue_die_and_self
    script: power_hunter_execution
  - id: purple_raging_flames
    category: efeito_roxo_monstro
    trigger: on_enter_play
    target: all_heroes
    effect:
      - kind: for_each
        over: all_heroes
        as: $loopTarget
        do:
          - kind: apply_damage
            to: $target
            amount: 1
  - id: purple_forge_chains
    category: efeito_roxo_monstro
    trigger: while_in_play
    target: heroes
    effect:
      - kind: block_action
        what: flee
  - id: purple_ruin_ashes
    category: efeito_roxo_monstro
    trigger: on_destroyed
    target: dungeon
    effect:
      - kind: discard_from
        pile: dungeon
        count: 1
  - id: purple_crimson_plate
    category: efeito_roxo_monstro
    trigger: first_damage_each_round
    target: self
    effect:
      - kind: prevent_next_damage
        to: $source
  - id: purple_ash_protection
    category: efeito_roxo_monstro
    trigger: on_take_damage
    target: self
    effect:
      - kind: add_modifier
        to: $source
        stat: damage_reduction
        operation: add
        value: $value
        duration:
          kind: while_in_play
  - id: purple_dark_awakening
    category: efeito_roxo_monstro
    trigger: on_enter_play
    target: dungeon
    effect:
      - kind: advance_dungeon_level
        amount: 1
  - id: purple_deadly_awakening
    category: efeito_roxo_monstro
    trigger: on_destroyed
    target: dungeon
    effect:
      - kind: advance_dungeon_level
        amount: 1
  - id: purple_ember_blood
    category: efeito_roxo_monstro
    trigger: on_take_damage
    target: attacking_hero
    script: purple_ember_blood
  - id: purple_depths_seal
    category: efeito_roxo_monstro
    trigger: while_in_play
    target: heroes
    effect:
      - kind: block_action
        what: power_use
  - id: purple_dark_tribute
    category: efeito_roxo_monstro
    trigger: before_combat
    target: group
    effect:
      - kind: choose_one
        options:
          - label: Descartar 1 item
            effect:
              - kind: discard_from
                pile: item
                count: 1
          - label: Descartar 1 carta de dungeon
            effect:
              - kind: discard_from
                pile: dungeon
                count: 1
  - id: purple_blood_tribute
    category: efeito_roxo_monstro
    trigger: before_combat
    target: group_or_chosen_hero
    effect:
      - kind: choose_one
        options:
          - label: Descartar 1 item
            effect:
              - kind: discard_from
                pile: item
                count: 1
          - label: Sofrer 3 dano
            effect:
              - kind: apply_damage
                to: $target
                amount: 3
  - id: purple_veil_retaliation
    category: efeito_roxo_monstro
    trigger: on_hit_received
    target: attacking_hero
    script: purple_veil_retaliation
  - id: purple_healing_rupture
    category: efeito_roxo_monstro
    trigger: on_enter_room
    target: heroes
    effect:
      - kind: block_action
        what: heal
  - id: purple_ancient_veil_prison
    category: efeito_roxo_monstro
    trigger: on_first_targeted
    target: target_hero
    effect:
      - kind: add_modifier
        to: $target
        stat: tohit_penalty
        operation: add
        value: 2
        duration:
          kind: once
  - id: purple_deep_veil_seal
    category: efeito_roxo_monstro
    trigger: while_in_play
    target: heroes
    effect:
      - kind: block_action
        what: dungeon_level_reduction
  - id: purple_crimson_shackles
    category: efeito_roxo_monstro
    trigger: on_first_target_chosen_by_creature
    target: target_hero
    effect:
      - kind: add_modifier
        to: $target
        stat: tohit_penalty
        operation: add
        value: 3
        duration:
          kind: once
      - kind: add_modifier
        to: $target
        stat: damage_penalty
        operation: add
        value: 3
        duration:
          kind: once
  - id: item_skill_deadly_edge
    category: habilidade_item
    trigger: combat
    target: self
    effect:
      - kind: add_modifier
        to: $source
        stat: tohit_bonus
        operation: add
        value: $value
        duration:
          kind: once
      - kind: add_modifier
        to: $source
        stat: damage_bonus
        operation: add
        value: $value
        duration:
          kind: once
  - id: item_skill_block
    category: habilidade_item
    trigger: on_take_damage
    target: self
    effect:
      - kind: add_modifier
        to: $source
        stat: damage_reduction
        operation: add
        value: $value
        duration:
          kind: while_in_play
  - id: item_skill_mystic_draw
    category: habilidade_item
    trigger: on_use
    target: artifact_deck
    effect:
      - kind: draw_from
        pile: artifact_deck
        count: $value
  - id: item_skill_last_light_blade
    category: habilidade_item
    trigger: combat_vs_boss_or_subboss
    target: self
    effect:
      - kind: add_modifier
        to: $source
        stat: tohit_bonus
        operation: add
        value: 2
        duration:
          kind: until_end_of_combat
      - kind: add_modifier
        to: $source
        stat: damage_bonus
        operation: add
        value: 2
        duration:
          kind: until_end_of_combat
  - id: dungeon_skill_confinement
    category: habilidade_dungeon
    trigger: while_room_active
    target: creatures_or_heroes_in_room
    effect:
      - kind: block_action
        what: flee
  - id: dungeon_skill_dead_torches
    category: habilidade_dungeon
    trigger: before_first_combat_in_room
    target: heroes
    effect:
      - kind: choose_one
        options:
          - label: Descartar 1 item
            effect:
              - kind: discard_from
                pile: item
                count: 1
          - label: Sofrer -1 no acerto
            effect:
              - kind: add_modifier
                to: $source
                stat: tohit_penalty
                operation: add
                value: 1
                duration:
                  kind: until_end_of_combat
  - id: dungeon_skill_column_fall
    category: habilidade_dungeon
    trigger: on_first_creature_destroyed_in_room
    target: remaining_creature
    effect:
      - kind: apply_damage
        to: $target
        amount: 1
  - id: dungeon_skill_uneven_floor
    category: habilidade_dungeon
    trigger: on_hero_lose_combat_in_room
    target: dungeon
    effect:
      - kind: discard_from
        pile: dungeon
        count: 1
  - id: dungeon_skill_forge_spoils
    category: habilidade_dungeon
    trigger: on_win_room
    target: item_deck
    effect:
      - kind: draw_and_choose
        pile: item_deck
        reveal: 2
        keep: 1
  - id: dungeon_skill_rekindled_forge
    category: habilidade_dungeon
    trigger: on_win_room
    target: item_deck_or_discard
    script: dungeon_skill_rekindled_forge
  - id: dungeon_skill_summon_guardian
    category: habilidade_dungeon
    trigger: on_room_reveal
    target: special_creature
    notes: Use {value} como o nome da criatura especial/subchefe revelado pela sala.
    script: dungeon_skill_summon_guardian
  - id: boss_skill_living_ash_throne
    category: habilidade_chefe
    trigger: first_damage_each_round
    target: boss
    effect:
      - kind: add_modifier
        to: $source
        stat: damage_reduction
        operation: add
        value: $value
        duration:
          kind: once
  - id: boss_skill_dark_forge_pressure
    category: habilidade_chefe
    trigger: after_each_combat_round_if_purple
    target: dungeon
    effect:
      - kind: if
        when:
          kind: compare
          op: gte
          left: $dungeon.level
          right: 4
        then:
          - kind: discard_from
            pile: dungeon
            count: 1
  - id: boss_skill_azhakar_ascension
    category: habilidade_chefe
    trigger: when_half_life_or_less
    target: boss
    effect:
      - kind: add_modifier
        to: $source
        stat: tohit_bonus
        operation: add
        value: 2
        duration:
          kind: passive
  - id: item_skill_drain_life_and_deadly_edge
    category: habilidade_item
    trigger: combat_and_on_damage_dealt
    target: self
    effect:
      - kind: add_modifier
        to: $source
        stat: tohit_bonus
        operation: add
        value: $value
        duration:
          kind: once
      - kind: add_modifier
        to: $source
        stat: damage_bonus
        operation: add
        value: $value
        duration:
          kind: once
      - kind: apply_heal
        to: $source
        amount: 1
  - id: item_skill_block_and_last_light_ward
    category: habilidade_item
    trigger: on_take_damage
    target: self
    effect:
      - kind: add_modifier
        to: $source
        stat: damage_reduction
        operation: add
        value: $armor
        duration:
          kind: while_in_play
      - kind: add_modifier
        to: $source
        stat: purple_damage_reduction
        operation: add
        value: $purple
        duration:
          kind: while_in_play
    params:
      armor: 3
      purple: 2
  - id: item_skill_crimson_fury_mighty
    category: habilidade_item
    trigger: before_attack_once_per_game
    target: self
    effect:
      - kind: apply_damage
        to: $source
        amount: $value
      - kind: add_modifier
        to: $source
        stat: damage_bonus
        operation: add
        value: 6
        duration:
          kind: until_end_of_combat
  - id: dungeon_skill_subboss_room
    category: habilidade_dungeon
    trigger: room_passive
    target: room
    effect:
      - kind: noop
  - id: dungeon_skill_empty_room
    category: habilidade_dungeon
    trigger: room_passive
    target: room
    effect:
      - kind: noop
