version: "1.0"
name: habilidades_1
game: Dungeon Deck - A Fornalha Sombria
placeholder:
  symbol: "*"
  jsonToken: "{value}"
  description: Use o valor específico da carta para substituir {value} no texto e no label.
categories:
  - hero_skill
  - hero_power
  - monster_purple
  - item_skill
  - dungeon_skill
  - boss_skill
abilities:
  - id: skill_crimson_fury
    category: hero_skill
    operate_type: op_triggered
    trigger:
      event: evt_attack_declared
    nature:
      - nat_physical
      - nat_fire
    effect:
      - kind: i_damage
        to: $source
        amount: $value
        minimum: 1
      - kind: p_modifier
        to: $source
        stat: s_damage_dealt
        operation: add
        value:
          op: mul
          args:
            - $value
            - 3
        duration:
          kind: once
    target_type: tgt_self
    affect_scope: scp_single
    affect_object: obj_friend
  - id: skill_last_light_healing
    category: hero_skill
    effect:
      - kind: i_heal
        to: $target
        amount: $value
    operate_type: op_active
    nature:
      - nat_magical
      - nat_holy
    target_type: tgt_target
    affect_scope: scp_single
    affect_object: obj_friend
  - id: skill_bastion_guard
    category: hero_skill
    effect:
      - kind: p_modifier
        to: $source
        stat: s_damage_reduction
        operation: add
        value: $value
        duration:
          kind: once
    operate_type: op_triggered
    trigger:
      event: evt_damage_taken
    nature:
      - nat_physical
    target_type: tgt_target
    affect_scope: scp_single
    affect_object: obj_friend
  - id: skill_rift_rune
    category: hero_skill
    operate_type: op_triggered
    trigger:
      event: evt_roll
    nature:
      - nat_magical
    effect:
      - kind: i_modify_die
        delta: $value
        die_side: hero
    target_type: tgt_self
    affect_scope: scp_single
    affect_object: obj_friend
  - id: skill_hunter_focus
    category: hero_skill
    script: skill_hunter_focus
    operate_type: op_passive
    nature:
      - nat_physical
    target_type: tgt_self
    affect_scope: scp_single
    affect_object: obj_friend
  - id: skill_living_ember
    category: hero_skill
    effect:
      - kind: i_damage
        to: $target
        amount: $value
    operate_type: op_active
    nature:
      - nat_physical
      - nat_fire
    target_type: tgt_enemy
    affect_scope: scp_single
    affect_object: obj_not_friend
  - id: skill_living_ember_oil
    category: item_skill
    operate_type: op_active
    nature:
      - nat_physical
      - nat_fire
    effect:
      - kind: i_if
        when:
          kind: has_skill
          of: $target
          skillId: skill_gelatinous_body
        then:
          - kind: i_damage
            to: $target
            amount: 3
        else:
          - kind: i_damage
            to: $target
            amount: 2
    target_type: tgt_enemy
    affect_scope: scp_single
    affect_object: obj_not_friend
  - id: skill_last_light_shield
