        to: $source
        stat: s_hit_bonus
        operation: add
        value: 2
        duration:
          kind: until_end_of_combat
      - kind: p_modifier
        to: $source
        stat: s_damage_dealt
        operation: add
        value: 2
        duration:
          kind: until_end_of_combat
    params:
      tohit: 2
      damage: 2
    operate_type: op_triggered
    trigger:
      event: evt_combat_start
    conditions:
      - kind: compare
        op: gte
        left: $dungeon.level
        right: 3
    nature:
      - nat_physical
      - nat_fire
  - id: skill_scorching_heat
