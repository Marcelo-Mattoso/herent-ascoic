  - id: skill_last_light_miracle
    category: habilidade
    target: ally_or_next_attack
    effect:
      - kind: i_choose_one
        options:
          - label: Curar 2
            effect:
              - kind: i_heal
                to: $target
                amount: 2
          - label: +2 dano
            effect:
              - kind: p_modifier
                to: $source
                stat: s_damage_dealt
