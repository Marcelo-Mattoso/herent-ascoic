name: Regenerate goldens for enemy deck recycling (temporary)
on:
  push:
    branches:
      - codex/expansao-torre-grande-bruxa-20261103
    paths:
      - .github/workflows/refresh-witch-goldens.yml
permissions:
  contents: write
jobs:
  replays:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Regenerate deterministic golden replays after intentional rule change
        run: npm run golden:record
      - name: Validate all existing and regenerated tests before committing
        run: npm test -- --maxWorkers=2 --testTimeout=15000
      - name: Commit replays
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/golden/replays/
          if git diff --cached --quiet; then
            echo "No golden replay changes"
          else
            git commit -m "test(golden): atualizar replays apos reembaralhar criaturas"
            git push origin HEAD:codex/expansao-torre-grande-bruxa-20261103
          fi
