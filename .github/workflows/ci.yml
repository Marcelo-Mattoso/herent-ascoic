name: CI and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
    env:
      PAGES_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test promotion safety guards
        run: node --test scripts/verify-webp-assets.test.mjs scripts/prepare-hml-promotion.test.mjs
      - run: npm run i18n:validate
      - run: npm run i18n:audit -- --check
      - run: npm run lint
      - run: npm test -- --maxWorkers=2 --testTimeout=15000
      - run: npm run test:coverage -- --maxWorkers=2 --testTimeout=15000
      - run: npm run build
      - run: npm run verify:build -- --base "$PAGES_BASE_PATH"
      - uses: actions/configure-pages@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist
          include-hidden-files: true

  e2e:
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Jobs have separate filesystems: generate local public assets in this
      # runner before the Vite dev server starts for Playwright tests.
      - run: npm run build
      - name: Verify bundled music assets
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import path from 'node:path';
            const manifest = JSON.parse(fs.readFileSync('dist/generated/music/manifest.json', 'utf8'));
            if (!Array.isArray(manifest.tracks) || manifest.tracks.length === 0) throw new Error('Music manifest is empty or invalid');
            const tracksByFile = new Map();
            for (const track of manifest.tracks) {
              if (tracksByFile.has(track.fileName)) throw new Error('Duplicate music track: ' + track.fileName);
              tracksByFile.set(track.fileName, track);
              const asset = path.join('dist', 'generated', 'music', 'assets', track.fileName);
              if (!fs.existsSync(asset)) throw new Error('Missing music asset: ' + asset);
            }
            const root = 'assets/expansions';
            const config = JSON.parse(fs.readFileSync(path.join(root, 'config.json'), 'utf8'));
            for (const expansion of config.expansions.filter(entry => entry.enabled)) {
              const packageDir = path.join(root, expansion.id);
              const pack = JSON.parse(fs.readFileSync(path.join(packageDir, 'expansion.json'), 'utf8'));
              for (const openingPath of Object.values(pack.openings ?? {})) {
                const opening = JSON.parse(fs.readFileSync(path.join(packageDir, openingPath), 'utf8'));
                const name = opening.audio?.fileName;
                if (name && !tracksByFile.has(name)) throw new Error('Opening music missing from manifest: ' + name);
              }
            }
            console.log('Verified ' + manifest.tracks.length + ' bundled music tracks and boss opening soundtracks');
          "
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, e2e]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
