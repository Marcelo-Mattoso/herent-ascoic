name: Refresh golden replays for current game rules
on:
  pull_request:
    branches: [dev]
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/a11y-artifact-panel-lint-20261103'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate deterministic current-rule replays
        run: npm run golden:record
      - name: Verify replay invariants and replay hashes
        run: npx vitest run tools/golden/golden.test.ts tools/golden/ecs.test.ts tools/golden/zones.test.ts tools/golden/legalActions.test.ts --maxWorkers=2 --testTimeout=15000
      - name: Commit only validated golden replays to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/golden/replays/*.json
          if git diff --cached --quiet; then
            echo "Golden fixtures are already current."
            exit 0
          fi
          git diff --cached --name-only
          git commit -m "test(golden): regravar partidas determinísticas com regras atualizadas"
          git push origin HEAD:refs/heads/${{ github.event.pull_request.head.ref }}
