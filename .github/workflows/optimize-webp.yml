name: Optimize WebP artwork

on:
  push:
    branches: [dev, feat/webp-assets-incremental-20261027]
    paths:
      - 'imagedata/**'
      - 'scripts/optimize-images.py'
      - 'requirements-assets.txt'
      - 'vite.config.ts'
      - '.github/workflows/optimize-webp.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webp-artwork-encoding
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-assets.txt
      - run: python -m pip install -r requirements-assets.txt
      - run: python scripts/optimize-images.py
      - run: python scripts/optimize-images.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run i18n:validate
      - run: npm run lint
      - run: npm test -- --maxWorkers=2 --testTimeout=15000
      - run: npm run build
        env:
          PAGES_BASE_PATH: /herent-ascoic/
      - run: npm run verify:build -- --base /herent-ascoic/
      - name: Commit optimized art back to current branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/webp
          if git diff --cached --quiet; then
            echo "No change in optimized images"
          else
            git commit -m "chore(assets): cache optimized WebP files"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
