name: if_counter executa o ramo else quando a comparação falha
kind: if_counter
given:
  counters:
    - { scope: jogo, id: "-", name: pontos, value: 2 }
    - { scope: jogo, id: "-", name: bonus, value: 0 }
when:
  - run:
      - kind: if_counter
        counter: { scope: jogo, id: "-", name: pontos }
        op: gt
        value: 2
        then:
          - { kind: change_counter, counter: { scope: jogo, id: "-", name: bonus }, delta: 1 }
        else:
          - { kind: change_counter, counter: { scope: jogo, id: "-", name: bonus }, delta: 100 }
then:
  counters: { "jogo:-:bonus": 100 }
